<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adult Search Results</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    header {
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      color: #ff6b35;
      font-size: 1.3rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
    }
    .search-row {
      display: flex;
      gap: 8px;
      flex: 1;
      max-width: 580px;
    }
    input {
      flex: 1;
      padding: 9px 16px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #ff6b35; }
    button {
      padding: 9px 18px;
      background: #ff6b35;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #e05a28; }

    /* filter bar */
    #filter-bar {
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid #1a1a1a;
      background: #0f0f0f;
    }
    .filter-btn {
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #2a2a2a;
      background: transparent;
      color: #888;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active,
    .filter-btn:hover {
      background: #1e1e1e;
      color: #ff6b35;
      border-color: #ff6b35;
    }

    /* status bar */
    #status {
      padding: 10px 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #555;
      border-bottom: 1px solid #171717;
    }
    .site-status {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      transition: background 0.3s;
    }
    .dot.loading { background: #f0a030; animation: pulse 1s infinite; }
    .dot.done { background: #3cb371; }
    .dot.error { background: #c0392b; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* grid */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      padding: 20px 24px;
    }
    .card {
      background: #161616;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1f1f1f;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #ff6b35;
    }
    .card a {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #0a0a0a;
      overflow: hidden;
    }
    .thumb-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .card:hover .thumb-wrap img { transform: scale(1.04); }
    .thumb-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #222;
    }
    .duration-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 500;
    }
    .site-badge {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .card-body { padding: 10px 12px 12px; }
    .card-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: #ddd;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      margin-top: 6px;
      font-size: 0.72rem;
      color: #555;
      display: flex;
      gap: 10px;
    }

    /* empty / loading states */
    #empty {
      display: none;
      text-align: center;
      padding: 80px 24px;
      color: #444;
    }
    #empty h2 { font-size: 1.4rem; margin-bottom: 8px; color: #555; }
    #result-count {
      padding: 8px 24px 0;
      font-size: 0.82rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#" id="home-link">🔍 Adult Search</a>
    <div class="search-row">
      <input id="q" type="text" placeholder="Search..." />
      <button id="search-btn">Search</button>
    </div>
  </header>

  <div id="filter-bar">
    <button class="filter-btn active" data-site="all">All Sites</button>
    <!-- site buttons injected by JS -->
  </div>

  <div id="status"></div>
  <div id="result-count"></div>

  <div id="grid"></div>

  <div id="empty">
    <h2>No results found</h2>
    <p>Try different keywords, or some sites may be temporarily unavailable.</p>
  </div>

  <script src="parsers.js"></script>
  <script src="results.js"></script>
</body>
</html>
